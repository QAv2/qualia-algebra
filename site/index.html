<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qualia Algebra — Transformation Map</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- SVG Canvas -->
  <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- Header -->
  <div class="map-header">
    <h1>Qualia Algebra</h1>
    <p id="header-subtitle">A Mathematical Framework for Consciousness</p>
    <a class="header-site-link" href="https://zenodo.org/records/22968135" target="_blank" rel="noopener">Read the paper &rarr;</a>
    <a class="header-site-link header-site-link-2" href="https://github.com/QAv2/qualia-algebra" target="_blank" rel="noopener">GitHub &rarr;</a>
  </div>

  <!-- QA Legend -->
  <div class="qa-legend">
    <div class="legend-title">Qualia Algebra</div>
    <div class="qa-legend-item" data-ring="center">
      <span class="legend-dot" style="background:#c9a84c"></span> The Observer
    </div>
    <div class="qa-legend-item" data-ring="foundations">
      <span class="legend-dot" style="background:#e8d5a0"></span> Axioms &amp; the Circuit
    </div>
    <div class="qa-legend-item" data-ring="geometry">
      <span class="legend-dot" style="background:#d08a58"></span> Geometry of Meaning
    </div>
    <div class="qa-legend-item" data-ring="worlds">
      <span class="legend-dot" style="background:#8a6ac0"></span> Capacity, Worlds &amp; Return
    </div>
    <div class="qa-legend-item" data-ring="instrument">
      <span class="legend-dot" style="background:#c0607e"></span> The Instrument
    </div>
    <div class="qa-legend-item" data-ring="convergence">
      <span class="legend-dot" style="background:#4a8cb0"></span> Convergences
    </div>
    <div class="qa-legend-item" data-ring="program">
      <span class="legend-dot" style="background:#5a9a6a"></span> Program &amp; Applications
    </div>
  </div>

  <!-- Search -->
  <div class="search-container">
    <div class="search-input-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" placeholder="Search nodes... (press / to open)" autocomplete="off" spellcheck="false">
    </div>
    <div class="search-results"></div>
  </div>

  <!-- Content Panel -->
  <div class="panel">
    <button class="panel-close">&times;</button>
    <div class="panel-inner"></div>
  </div>

  <!-- Bottom Toolbar -->
  <div class="toolbar">
    <button id="btn-reset"><span class="btn-label">Reset View</span></button>
    <div class="separator"></div>
    <button id="btn-zoom-in"><span class="btn-label">Zoom In</span></button>
    <button id="btn-zoom-out"><span class="btn-label">Zoom Out</span></button>
    <div class="separator"></div>
    <button id="btn-toggle-connections"><span class="btn-label">Connections</span></button>
    <div class="separator"></div>
    <button id="btn-search"><span class="btn-label">Search</span></button>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
